# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  zcov:
    url: github:ericsssan/zcov
    flake: false
  zig-overlay:
    url: github:mitchellh/zig-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  zls:
    url: github:zigtools/zls
    inputs:
      nixpkgs:
        follows: nixpkgs
      zig-overlay:
        follows: zig-overlay
